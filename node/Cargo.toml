[package]
name = "sxt-node"
description = "The Space and Time Transaction Node"
version = "1.3.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

build = "build.rs"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
clap = { features = ["derive"], workspace = true }
futures = { features = ["thread-pool"], workspace = true }
serde_json = { workspace = true, default-features = true }
jsonrpsee = { features = ["server"], workspace = true }
snafu = { workspace = true, default-features = false }

polkadot-sdk = { workspace = true, features = [
	"sc-cli", "sp-core", "sc-executor", "sc-network", "sc-service", "sc-telemetry", "sc-transaction-pool", "sc-transaction-pool-api",
	"sc-consensus", "sc-offchain", "sc-consensus-grandpa", "sc-consensus-babe", "sc-client-api", "sc-rpc-api", "sc-basic-authorship", 
	"sp-runtime", "sp-io", "sp-timestamp", "sp-inherents", "sp-keyring", "sp-api", "sp-blockchain", "sp-block-builder", "frame-system",
	"sp-transaction-storage-proof", "sp-consensus-babe", "sp-statement-store", "sc-statement-store", "sc-rpc", "sc-network-statement", 
	"sc-network-sync", "sc-storage-monitor", "sc-sync-state-rpc", "sc-consensus-slots", "sc-authority-discovery", "sc-chain-spec",
	"pallet-staking", "sp-authority-discovery",
	"pallet-transaction-payment", "pallet-transaction-payment-rpc", "frame-benchmarking", "frame-benchmarking-cli",
]}

sxt-runtime.workspace = true
native.workspace = true
sxt-core.workspace = true
proof-of-sql-commitment-map = { workspace = true, features = [ "substrate"] }
proof-of-sql-static-setups = { workspace = true, features = ["io"] }
sqlparser = { workspace = true, default-features = false }
bs58 = "0.5.1"
dotenv = "0.15.0"

rand.workspace = true
node-rpc.workspace = true
serde.workspace = true
codec = { workspace = true, default-features = true }

[build-dependencies]
substrate-build-script-utils.workspace = true
substrate-build-script-utils.default-features = true

[features]
default = ["std"]
std = [
	"sxt-runtime/std",
	"native/std",
	"sxt-core/std",
]
# Dependencies that are only required if runtime benchmarking should be build.
runtime-benchmarks = [
	"polkadot-sdk/runtime-benchmarks",
	"sxt-runtime/runtime-benchmarks",
]
# Enable features that allow the runtime to be tried and debugged. Name might be subject to change
# in the near future.
try-runtime = [
	"polkadot-sdk/try-runtime",
	"sxt-runtime/try-runtime",
]

[lints]
workspace = true
