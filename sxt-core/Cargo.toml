[package]
name = "sxt-core"
version = "0.1.0"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
codec = { package = "parity-scale-codec", workspace = true, default-features = false, features = [
    "derive",
] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }
frame-benchmarking = { workspace = true, default-features = false, optional = true }
frame-support = { workspace = true, default-features = false, features = ["experimental"] }
frame-system = { workspace = true, default-features = false }
snafu = { workspace = true }
sp-runtime = { workspace = true, default-features = false }
sp-core = { workspace = true, default-features = false}
sp-runtime-interface = { version = "28.0.0", default-features = false } 
sqlparser = { workspace = true, default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"]}
postcard = { workspace = true, features = ["alloc"], optional = true }
on-chain-table = { workspace = true, default-features = false, features = ["arrow"], optional = true }
tonic = { workspace = true, optional = true }
arrow = { workspace = true, optional = true, features = ["ipc"]}
arrow-flight = { workspace = true, optional = true, features = ["flight-sql-experimental"] }
subxt = { workspace = true, optional = true, features = ["native", "unstable-reconnecting-rpc-client"] }
data-loader = { workspace = true, optional = true }
glob = "0.3.1"

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"scale-info/std",
	"dep:tonic",
	"dep:arrow",
	"dep:arrow-flight",
	"dep:subxt",
	"dep:on-chain-table",
	"dep:postcard",
	"dep:data-loader"
]

[lints]
workspace = true
