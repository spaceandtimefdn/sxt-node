[package]
name = "sxt-core"
version = "0.1.0"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
bincode.workspace = true
codec = { package = "parity-scale-codec", workspace = true, default-features = false, features = [
    "derive",
] }
scale-info = { workspace = true, default-features = false, features = ["derive"] }

polkadot-sdk = { workspace = true, default-features = false, features = [
	"frame-benchmarking", "frame-support", "frame-system",
	"sp-runtime", "sp-core", "sp-runtime-interface",
	"sp-api",
]}

# Required for the PassByCodec derive macro to work
sp-runtime-interface = { workspace = true, default-features = false }

snafu = { workspace = true }
sqlparser = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = ["derive"]}
postcard = { workspace = true, features = ["alloc"] }
on-chain-table = { workspace = true, default-features = false }
tonic = { workspace = true, optional = true }
arrow = { workspace = true, optional = true, features = ["ipc"]}
subxt = { workspace = true, optional = true, features = ["native", "reconnecting-rpc-client"] }
glob.workspace = true
tokio = { workspace = true, optional = true }
proof-of-sql = { workspace = true, default-features = false }
exponential-backoff = { workspace = true, default-features = false, optional = true }
k256 = { workspace = true, default-features = false }
sha3 = { workspace = true, default-features = false }
hex = { workspace = true, default-features = false }
alloy = { workspace = true, optional = true, features = ["full"]}
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
regex = { workspace = true, default-features = false }
rand_core = { workspace = true, default-features = false }
rand_chacha = { workspace = true, default-features = false }
proptest = { workspace = true, features = ["std"], optional = true }
proptest-derive = { workspace = true, optional = true }
arrow-ipc-no-std.workspace = true

[dev-dependencies]
rand = "0.8.5"
proptest = { workspace = true, features = ["std"] }
arrow = { workspace = true, features = ["ipc"] }
on-chain-table = { workspace = true, features = ["arrow", "proptest"] }
arrow-ipc-no-std = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = [
	"polkadot-sdk/std",
	"sp-runtime-interface/std",
	"dep:alloy",
	"hex/std",
	"k256/std",
	"sha3/std",
	"codec/std",
	"on-chain-table/arrow",
	"scale-info/std",
	"dep:tokio",
	"dep:tonic",
	"dep:arrow",
	"dep:subxt",
	"dep:exponential-backoff",
]
proptest = ["std", "dep:proptest", "on-chain-table/proptest", "dep:proptest-derive"]

[lints]
workspace = true
