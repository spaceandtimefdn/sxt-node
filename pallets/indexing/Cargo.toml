[package]
name = "pallet-indexing"
description = "FRAME pallet template for defining custom runtime logic. (polkadot v1.15.0)"
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = [
	"derive",
], workspace = true }
commitment-sql.workspace = true
scale-info = { features = [
	"derive",
], workspace = true }

polkadot-sdk = { workspace = true, features = ["frame-benchmarking", "frame-support", "frame-system", "pallet-session", "sp-runtime", "sp-core"]}

pallet-commitments.workspace = true
pallet-permissions.workspace = true
pallet-tables.workspace = true
pallet-system-tables.workspace = true
hex.workspace = true
sxt-core.workspace = true

native-api = { workspace = true, default-features = false}
postcard.workspace = true
proof-of-sql-static-setups = { workspace = true, features = ["io"], optional = true }
on-chain-table = { workspace = true, default-features = false }
proof-of-sql-commitment-map.workspace = true

[dev-dependencies]
polkadot-sdk = { workspace = true, features = ["sp-staking", "frame-election-provider-support", "pallet-staking-reward-curve", "pallet-timestamp", "pallet-balances", "pallet-staking", "sp-core", "sp-io", "sp-runtime"]}

proof-of-sql-static-setups = { workspace = true, features = ["io"] }
native.workspace = true
arrow.workspace = true
proof-of-sql-commitment-map.workspace = true
pallet-zkpay.workspace = true

[features]
default = ["std"]
std = [
	"polkadot-sdk/std",
	"codec/std",
	"scale-info/std",
	"native/std",
	"native-api/std",
	"on-chain-table/std",
	"pallet-commitments/std",
	"pallet-tables/std",
	"pallet-system-tables/std",
	"pallet-zkpay/std",
]
runtime-benchmarks = [
	"polkadot-sdk/runtime-benchmarks",
	"pallet-system-tables/runtime-benchmarks",
	"pallet-tables/runtime-benchmarks",
	"dep:proof-of-sql-commitment-map",
]
try-runtime = [
	"polkadot-sdk/try-runtime",
]
