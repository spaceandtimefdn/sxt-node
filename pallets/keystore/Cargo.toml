[package]
name = "pallet-keystore"
description = "FRAME pallet template for defining custom runtime logic. (polkadot v1.15.0)"
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = [
	"derive",
], workspace = true }
scale-info = { features = [
	"derive",
], workspace = true }

polkadot-sdk = { workspace = true, features = ["frame-benchmarking", "frame-support", "frame-system"] }

sxt-core.workspace = true
k256 = { workspace = true, default-features = false, optional = true }
sha3 = { workspace = true, default-features = false, optional = true }

[dev-dependencies]
k256 = { version = "0.13.4", default-features = false }
polkadot-sdk = { workspace = true, features = ["sp-core", "sp-io", "sp-runtime",] }

[features]
default = ["std"]
std = [
	"polkadot-sdk/std",
	"codec/std",
	"scale-info/std",
	"sxt-core/std",
	"k256/std",
	"sha3/std",
]
runtime-benchmarks = [
	"polkadot-sdk/runtime-benchmarks",
        "dep:k256",
        "dep:sha3",
]
try-runtime = [
	"polkadot-sdk/try-runtime",
]

[lints]
workspace = true
