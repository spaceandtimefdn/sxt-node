[package]
name = "pallet-offchain-indexing"
description = "Offchain worker that forwards table lifecycle and data events to an external HTTP indexer service."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
frame-support.workspace = true
frame-system.workspace = true
sp-core = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sxt-core.workspace = true
on-chain-table = { workspace = true, default-features = false }
pallet-tables.workspace = true
commitment-sql.workspace = true
postcard = { workspace = true, default-features = false }
log = { workspace = true, default-features = false }
serde = { workspace = true, default-features = false, features = ["derive"] }
serde_json = { workspace = true, default-features = false, features = ["alloc"] }
sqlparser.workspace = true

# prost is std-only; used in the offchain worker (native) path to encode
# protobuf messages for HTTP+protobuf transport.
prost = { version = "0.13", optional = true }

# Arrow is std-only; used for DDL→Arrow IPC schema and OnChainTable→Arrow IPC
# conversion in the offchain worker path.
arrow = { workspace = true, features = ["ipc"], optional = true }

[build-dependencies]
prost-build = { version = "0.13", optional = true }

[dev-dependencies]
sp-io.workspace = true
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
pallet-permissions = { workspace = true, features = ["std"] }
pallet-commitments = { workspace = true, features = ["std"] }
pallet-tables = { workspace = true, features = ["std"] }
on-chain-table = { workspace = true, features = ["std", "arrow"] }
arrow = { workspace = true, features = ["ipc"] }
sqlparser = { workspace = true, features = ["std"] }
postcard = { workspace = true, features = ["use-std"] }
prost = "0.13"
parking_lot = "0.12"

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "scale-info/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sxt-core/std",
    "on-chain-table/std",
    "on-chain-table/arrow",
    "pallet-tables/std",
    "commitment-sql/std",
    "postcard/use-std",
    "log/std",
    "serde/std",
    "serde_json/std",
    "sqlparser/std",
    "dep:prost",
    "dep:prost-build",
    "dep:arrow",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
