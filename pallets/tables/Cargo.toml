[package]
name = "pallet-tables"
description = "Pallet for managing indexing targets"
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = [
	"derive",
], workspace = true }
commitment-sql.workspace = true
scale-info = { features = [
	"derive",
], workspace = true }

polkadot-sdk = { workspace = true, features = [
	"frame-benchmarking", "frame-support", "frame-system", "sp-api", "sp-runtime", "sp-core", "pallet-balances"
]}

pallet-permissions.workspace = true
sxt-core.workspace = true
pallet-commitments.workspace = true
proof-of-sql-commitment-map.workspace = true
hex.workspace = true
sqlparser.workspace = true
snafu.workspace = true

[dev-dependencies]
polkadot-sdk = { workspace = true, features = [
	"sp-core", "sp-io", "sp-runtime",
]}

[features]
default = ["std"]
std = [
	"polkadot-sdk/std",
	"codec/std",
	"scale-info/std",
	"pallet-commitments/std",
]
runtime-benchmarks = [
	"polkadot-sdk/runtime-benchmarks",
]
try-runtime = [
	"polkadot-sdk/try-runtime",
]

[lints]
workspace = true
