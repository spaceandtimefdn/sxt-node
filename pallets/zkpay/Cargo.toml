[package]
name = "pallet-zkpay"
description = "Pallet for custom logic related to ZKpay"
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = [
	"derive",
], workspace = true }
scale-info = { features = [
	"derive",
], workspace = true }

polkadot-sdk = { workspace = true, features = [
	"frame-benchmarking", "frame-support", "frame-system", "pallet-balances", "sp-runtime", "sp-core", "sp-io",
] }

sxt-core.workspace = true
hex.workspace = true

[features]
default = ["std"]
std = [
	"polkadot-sdk/std",
	"codec/std",
	"scale-info/std",
	"sxt-core/std",
	"hex/std",
]
runtime-benchmarks = [
	"polkadot-sdk/runtime-benchmarks",
]
try-runtime = [
	"polkadot-sdk/try-runtime",
]

[lints]
workspace = true
