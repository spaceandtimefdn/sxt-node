[package]
name = "pallet-smartcontracts"
description = "FRAME pallet template for defining custom runtime logic. (polkadot v1.15.0)"
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = [
	"derive",
], workspace = true }
scale-info = { features = [
	"derive",
], workspace = true }

polkadot-sdk = { workspace = true, features = ["frame-benchmarking", "frame-support", "frame-system", "sp-core"] }

sxt-core.workspace = true
pallet-permissions.workspace = true 
pallet-tables.workspace = true 
pallet-indexing.workspace = true
native-api = { workspace = true, default-features = false}
proof-of-sql-commitment-map = { workspace = true, optional = true }

[dev-dependencies]
polkadot-sdk = { workspace = true, features = [
	"sp-io", "sp-runtime", "sp-staking", "frame-election-provider-support", "pallet-staking-reward-curve",
	"pallet-timestamp", "pallet-balances", "pallet-staking", "pallet-session",
	]}

proof-of-sql-commitment-map = { workspace = true }
pallet-commitments.workspace = true
pallet-system-tables.workspace = true
pallet-zkpay.workspace = true

[features]
default = ["std"]
std = [
	"polkadot-sdk/std",
	"codec/std",
	"scale-info/std",
	"sxt-core/std",
	"pallet-permissions/std",
	"pallet-tables/std",
	"pallet-indexing/std",
	"native-api/std",
	"pallet-zkpay/std",
]
runtime-benchmarks = [
	"polkadot-sdk/runtime-benchmarks",
	"pallet-tables/runtime-benchmarks",
	"dep:proof-of-sql-commitment-map",
]
try-runtime = [
	"polkadot-sdk/try-runtime",
]

[lints]
workspace = true
