[package]
name = "pallet-prover-db-indexer"
description = "Offchain worker that forwards table lifecycle and data events to an external prover-db indexer (HTTP)."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }

polkadot-sdk = { workspace = true, features = [
    "frame-support", "frame-system", "sp-core", "sp-io", "sp-runtime", "sp-tracing",
]}

sxt-core.workspace = true
commitment-sql.workspace = true
native.workspace = true
pallet-indexing.workspace = true
pallet-tables.workspace = true
prost = { version = "0.13", default-features = false, features = ["prost-derive"] }
snafu = { workspace = true }
url = { workspace = true }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
polkadot-sdk = { workspace = true, features = [
    "sp-staking", "frame-election-provider-support", "pallet-staking-reward-curve",
    "pallet-timestamp", "pallet-balances", "pallet-staking", "pallet-session",
]}
native-api = { workspace = true, features = ["std"] }
pallet-permissions.workspace = true
pallet-commitments.workspace = true
pallet-system-tables.workspace = true
pallet-zkpay.workspace = true
proof-of-sql-commitment-map.workspace = true
parking_lot = "0.12"

[features]
default = ["std"]
std = [
    "polkadot-sdk/std",
    "codec/std",
    "scale-info/std",
    "sxt-core/std",
    "commitment-sql/std",
    "native/std",
    "pallet-indexing/std",
    "pallet-tables/std",
    "prost/std",
    "snafu/std",
    "url/std",
]
try-runtime = [
    "polkadot-sdk/try-runtime",
]

[lints]
workspace = true
