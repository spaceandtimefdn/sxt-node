[package]
name = "pallet-system-contracts"
description = "pallet storing information about contracts important to core sxt chain functionality"
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = [
	"derive",
], workspace = true }
scale-info = { features = [
	"derive",
], workspace = true }

polkadot-sdk = { workspace = true, features = ["frame-benchmarking", "frame-support", "frame-system", "sp-core"] }

sxt-core.workspace = true

[dev-dependencies]
polkadot-sdk = { workspace = true, features = ["sp-runtime", "sp-io"] }

[features]
default = ["std"]
std = [
	"codec/std",
	"polkadot-sdk/std",
	"scale-info/std",
	"sxt-core/std"
]
runtime-benchmarks = [
	"polkadot-sdk/runtime-benchmarks",
]
try-runtime = [
	"polkadot-sdk/try-runtime",
]

[lints]
workspace = true
