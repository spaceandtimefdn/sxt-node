[package]
name = "pallet-block-forwarder"
description = "Offchain worker that forwards table lifecycle and data events to an external HTTP indexer service."
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = ["derive"], workspace = true }
scale-info = { features = ["derive"], workspace = true }
frame-support.workspace = true
frame-system.workspace = true
sp-core = { workspace = true, default-features = false }
sp-io = { workspace = true, default-features = false }
sp-runtime = { workspace = true, default-features = false }
sxt-core.workspace = true
pallet-tables.workspace = true
log = { workspace = true, default-features = false }
prost = { version = "0.13", default-features = false, features = ["prost-derive"] }

[build-dependencies]
prost-build = "0.13"

[dev-dependencies]
sp-io.workspace = true
sp-core = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
pallet-permissions = { workspace = true, features = ["std"] }
pallet-commitments = { workspace = true, features = ["std"] }
pallet-tables = { workspace = true, features = ["std"] }
parking_lot = "0.12"

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "scale-info/std",
    "sp-core/std",
    "sp-io/std",
    "sp-runtime/std",
    "sxt-core/std",
    "pallet-tables/std",
    "log/std",
    "prost/std",
]
try-runtime = [
    "frame-support/try-runtime",
    "frame-system/try-runtime",
]
