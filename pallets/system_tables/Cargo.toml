[package]
name = "pallet-system-tables"
description = "Substrate pallet for parsing system information out of submitted data"
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = [
	"derive",
], workspace = true }
scale-info = { features = [
	"derive",
], workspace = true }
frame-benchmarking = { optional = true, workspace = true }
frame-support.workspace = true
frame-system.workspace = true
pallet-tables.workspace = true
pallet-balances.workspace = true
pallet-commitments.workspace = true
pallet-staking.workspace = true
pallet-session.workspace = true
pallet-permissions.workspace = true
sxt-core = { default-features = false, workspace = true }
sp-runtime.workspace = true
on-chain-table = { workspace = true, default-features = false }
sp-core = { workspace = true, default-features = false }
spin.workspace = true
hex.workspace = true

[dev-dependencies]
sp-core = { default-features = true, workspace = true }
sp-io = { default-features = true, workspace = true }
sp-runtime = { default-features = true, workspace = true }
sp-staking = { default-features = true, workspace = true }
frame-election-provider-support.workspace = true

[features]
default = ["std"]
std = [
	"codec/std",
	"frame-benchmarking?/std",
	"frame-support/std",
	"frame-system/std",
	"scale-info/std",
	"sp-core/std",
	"sp-io/std",
	"sp-runtime/std",
	"pallet-tables/std",
	"pallet-balances/std",
	"pallet-commitments/std",
	"pallet-staking/std",
	"sxt-core/std",
	"sp-runtime/std",
	"on-chain-table/std",
]

runtime-benchmarks = [
	"frame-benchmarking/runtime-benchmarks",
	"frame-support/runtime-benchmarks",
	"frame-system/runtime-benchmarks",
	"sp-runtime/runtime-benchmarks",
]
try-runtime = [
	"frame-support/try-runtime",
	"frame-system/try-runtime",
	"sp-runtime/try-runtime",
]

[lints]
workspace = true

